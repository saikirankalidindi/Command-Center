<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Command Center - Personal Dashboard" />
  <title>Command Center</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌘</text></svg>" />

  <!-- Google Fonts: Inter (optional, loaded lazily) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/sidebar.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/tasks.css" />
  <link rel="stylesheet" href="styles/projects.css" />
  <link rel="stylesheet" href="styles/stats.css" />
  <link rel="stylesheet" href="styles/reminders.css" />
  <link rel="stylesheet" href="styles/quicklinks.css" />
  <link rel="stylesheet" href="styles/settings.css" />
</head>
<body>

  <!-- App Shell -->
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar" role="navigation" aria-label="Main navigation">
      <!-- Rendered by app.js -->
    </aside>

    <!-- Main Content Area -->
    <main id="main-content" role="main">

      <!-- Search Bar (fixed at top) -->
      <div id="search-bar-container" role="search" aria-label="Search">
        <!-- Rendered by app.js -->
      </div>

      <!-- Page Content (changes with route) -->
      <div id="page-content" aria-live="polite">
        <!-- Rendered by router -->
      </div>

    </main>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts (order matters: utils/store first, then modules, then app) -->
  <script src="scripts/utils.js"></script>
  <script src="scripts/store.js"></script>
  <script src="scripts/router.js"></script>
  <script src="scripts/search.js"></script>
  <script src="scripts/tasks.js"></script>
  <script src="scripts/projects.js"></script>
  <script src="scripts/stats.js"></script>
  <script src="scripts/reminders.js"></script>
  <script src="scripts/quicklinks.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/app.js"></script>

</body>
</html>
